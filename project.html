<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Yeonseo Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,200;0,300;0,400;1,200;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f2ea;--bg2:#ede8de;--ink:#1a1712;--ink2:#3d3830;
  --ink3:rgba(26,23,18,0.45);--accent:#9b2020;
  --serif:'Cormorant',Georgia,serif;--sans:'DM Sans','Helvetica Neue',sans-serif;
  --line:rgba(26,23,18,0.1);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}

nav{position:fixed;top:0;left:0;right:0;z-index:800;display:flex;align-items:center;justify-content:space-between;
  padding:18px 40px;background:rgba(247,242,234,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.nav-logo{font-family:var(--serif);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.nav-back{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);text-decoration:none;transition:color .3s}
.nav-back:hover{color:var(--accent)}

header.hd{padding:150px 40px 0;max-width:1180px;margin:0 auto}
.hd-idx{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.hd-title{font-family:var(--serif);font-weight:200;font-size:clamp(38px,7vw,84px);line-height:1.02;letter-spacing:-.01em}
.hd-title em{font-style:italic;display:block;color:var(--ink2)}
.hd-meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line);
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.hd-desc{margin-top:34px;max-width:640px;font-size:15px;line-height:1.85;color:var(--ink2)}

.vid{max-width:1180px;margin:64px auto 0;padding:0 40px}
.vid-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

main{max-width:1180px;margin:0 auto;padding:64px 40px 140px}
.gal{columns:2;column-gap:18px}
@media(max-width:760px){.gal{columns:1}}
.gal figure{break-inside:avoid;margin:0 0 18px;background:var(--bg2);overflow:hidden;cursor:zoom-in}
.gal img{display:block;width:100%;height:auto;opacity:0;transform:translateY(14px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.gal img.in{opacity:1;transform:none}
.gal figure:hover img{opacity:.88}

.empty{padding:60px 0;color:var(--ink3);font-size:13px;letter-spacing:.06em;line-height:1.9;max-width:520px}

.pager{max-width:1180px;margin:0 auto;padding:0 40px 120px;display:flex;justify-content:space-between;gap:20px;
  border-top:1px solid var(--line);padding-top:34px}
.pager a{text-decoration:none;color:var(--ink3);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;transition:color .3s;max-width:45%}
.pager a:hover{color:var(--accent)}
.pager .pg-t{display:block;font-family:var(--serif);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:8px;line-height:1.2}

#lb{position:fixed;inset:0;z-index:9000;background:rgba(20,18,14,.94);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;object-fit:contain}
#lb .lbnav{position:absolute;top:50%;transform:translateY(-50%);color:#f7f2ea;font-size:34px;padding:20px;cursor:pointer;opacity:.55;user-select:none}
#lb .lbnav:hover{opacity:1}
#lb .lbp{left:8px}#lb .lbn{right:8px}
#lb .lbc{position:absolute;top:18px;right:26px;color:#f7f2ea;font-size:26px;cursor:pointer;opacity:.6}
#lb .lbct{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(247,242,234,.6);font-size:11px;letter-spacing:.2em}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Yeonseo Lee</a>
  <a href="/#projects" class="nav-back">← All Work</a>
</nav>

<header class="hd">
  <div class="hd-idx" id="pIdx"></div>
  <h1 class="hd-title" id="pTitle"></h1>
  <div class="hd-meta" id="pMeta"></div>
  <p class="hd-desc" id="pDesc"></p>
</header>

<div class="vid" id="pVid" hidden><div class="vid-frame"><iframe id="pFrame" allowfullscreen loading="lazy"></iframe></div></div>

<main><div class="gal" id="pGal"></div></main>

<div class="pager" id="pPager"></div>

<div id="lb"><span class="lbnav lbp">‹</span><img id="lbImg" alt=""><span class="lbnav lbn">›</span><span class="lbc">✕</span><span class="lbct" id="lbCt"></span></div>

<script src="/data/projects.js"></script>
<script>
const P = window.PROJECTS || [];
const params = new URLSearchParams(location.search);
let i = parseInt(params.get('i'), 10);
if (isNaN(i)) { const s = params.get('p'); i = Math.max(0, P.findIndex(x => x.slug === s)); }
if (i < 0 || i >= P.length) i = 0;
const p = P[i];

document.title = p.title + ' — Yeonseo Lee';
document.getElementById('pIdx').textContent = String(i + 1).padStart(2, '0') + ' — ' + (p.cat || '');
document.getElementById('pTitle').innerHTML = p.title + (p.subtitle ? '<em>' + p.subtitle + '</em>' : '');
document.getElementById('pMeta').innerHTML =
  [p.year, p.role, p.status].filter(Boolean).map(t => '<span>' + t + '</span>').join('');
document.getElementById('pDesc').textContent = p.desc || '';

if (p.video) {
  document.getElementById('pVid').hidden = false;
  document.getElementById('pFrame').src = p.video;
}

const imgs = p.images || [];
const gal = document.getElementById('pGal');
if (imgs.length) {
  gal.innerHTML = imgs.map((src, n) =>
    '<figure data-n="' + n + '"><img loading="lazy" src="' + src + '" alt="' + p.title + ' ' + (n + 1) + '"></figure>'
  ).join('');
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '80px' });
  gal.querySelectorAll('img').forEach(el => io.observe(el));
} else {
  gal.innerHTML = '<p class="empty">Detail images for this project are being added.' +
    (p.video ? ' The film is above.' : '') + '</p>';
}

/* lightbox */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCt = document.getElementById('lbCt');
let cur = 0;
function show(n) { cur = (n + imgs.length) % imgs.length; lbImg.src = imgs[cur]; lbCt.textContent = (cur + 1) + ' / ' + imgs.length; }
gal.addEventListener('click', e => { const f = e.target.closest('figure'); if (!f) return; lb.classList.add('on'); show(+f.dataset.n); });
lb.addEventListener('click', e => {
  if (e.target.classList.contains('lbn')) { show(cur + 1); return; }
  if (e.target.classList.contains('lbp')) { show(cur - 1); return; }
  if (e.target.tagName !== 'IMG') lb.classList.remove('on');
});
addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});

/* prev / next project */
const prev = P[(i - 1 + P.length) % P.length], next = P[(i + 1) % P.length];
document.getElementById('pPager').innerHTML =
  '<a href="/project.html?i=' + ((i - 1 + P.length) % P.length) + '">← Previous<span class="pg-t">' + prev.title + '</span></a>' +
  '<a style="text-align:right" href="/project.html?i=' + ((i + 1) % P.length) + '">Next →<span class="pg-t">' + next.title + '</span></a>';
</script>
</body>
</html>
